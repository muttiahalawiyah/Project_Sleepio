<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content />
        <meta name="author" content />
        <title>Modern Business - Start Bootstrap Template</title>
        <!-- Favicon-->
        <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
        <!-- Custom Google font-->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@100;200;300;400;500;600;700;800;900&amp;display=swap" rel="stylesheet" />
        <!-- Bootstrap icons-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css" rel="stylesheet" />
        <!-- Core theme CSS (includes Bootstrap)-->
        <link href="css/styles.css" rel="stylesheet" />
        <link href="https://fonts.cdnfonts.com/css/gt-walsheim-trial" rel="stylesheet">
        <style>
        body {
            font-family: 'GT Walsheim Trial', sans-serif;
            margin: 0;
            padding: 0;
        }

        h1 {
            font-size: 32px;
        }
        .btn-custom {
        background-color: #F38771;
        border: none;
        color: white;
        transition: 0.2s ease;
    }

    .btn-custom:hover {
        background-color: #d96a59;
    }

    .btn-custom:active {
        background-color: #c85d4f;
    }
    </style>
    </head>
    <body class="d-flex flex-column">
        <main class="flex-shrink-0">
            <!-- Navigation-->
      <div id="navbar"></div>
            <!-- Page content-->
            <section class="py-5">
                <div class="container px-5">
                    <!-- Contact form-->
                    <div class="rounded-4 py-5 px-4 px-md-5" style="background-color: #2E4769;">
                        <div class="text-center mb-5">
                            <h1 class="fw-bolder text-white">Create New Room</h1>
                            <p class="lead fw-normal text-muted mb-0">Let's Create Your Own Community</p>
                        </div>
                        <div class="row gx-5 justify-content-center">
                            <div class="col-lg-8 col-xl-6">
                                <!-- * * * * * * * * * * * * * * *-->
                                <!-- * * SB Forms Contact Form * *-->
                                <!-- * * * * * * * * * * * * * * *-->
                                <!-- This form is pre-integrated with SB Forms.-->
                                <!-- To make this form functional, sign up at-->
                                <!-- https://startbootstrap.com/solution/contact-forms-->
                                <!-- to get an API token!-->
                                <form id="contactForm" data-sb-form-api-token="API_TOKEN">
                                    <!-- Name input-->
                                    <div class="form-floating mb-3">
                                        <input class="form-control" id="name" type="text" placeholder="Enter your name..." data-sb-validations="required" />
                                        <label for="name">Room Name</label>
                                        <div class="invalid-feedback" data-sb-feedback="name:required">A name is required.</div>
                                    </div>
                                    <!-- Message input-->
                                    <div class="form-floating mb-3">
                                        <textarea class="form-control" id="message" type="text" placeholder="Enter your message here..." style="height: 10rem" data-sb-validations="required"></textarea>
                                        <label for="message">Room Description</label>
                                        <div class="invalid-feedback" data-sb-feedback="message:required">A description is required.</div>
                                    </div>
                                    <div class="form-floating mb-3">
    <input 
        class="form-control" 
        id="number-input" 
        type="number" 
        placeholder="Select Max Person" 
        data-sb-validations="required"
    />
    <label for="number-input">Max Capacity</label>
    <div class="invalid-feedback" data-sb-feedback="name:required">
        A name is required.
    </div>
</div>

                                    <!-- Submit Button -->
                                    <div class="d-grid">
    <a class="btn btn-lg btn-custom" id="submitButton" href="chat_page.html">
        Join Room
    </a>
</div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    <!-- Footer-->
    <div id="footer"></div>
    <!-- Bootstrap core JS-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="assets/vendor/php-email-form/validate.js"></script>
    <script src="assets/vendor/aos/aos.js"></script>
    <script src="assets/vendor/glightbox/js/glightbox.min.js"></script>
    <script src="assets/vendor/swiper/swiper-bundle.min.js"></script>
    <!-- Core theme JS-->
    <script src="js/scripts.js"></script>
    <script>
      fetch("navbar.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("navbar").innerHTML = data;
        });
    </script>
    <script>
      fetch("footer.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("footer").innerHTML = data;
        });
    </script>
    </body>
</html>
